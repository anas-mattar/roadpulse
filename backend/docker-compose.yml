# Local and server stack for RoadPulse (ADR 0002).
#   docker compose up -d --build
# API: http://localhost:8080 (OpenAPI: /openapi/v1.json, health: /health)
# Routing: http://localhost:8002 (first start downloads the Malaysia/Singapore/Brunei extract and
# builds routing tiles: several minutes, a few GB of disk).
# Settings go in a .env file next to this file (never commit it):
#   POSTGRES_PASSWORD=...
#   MODERATOR_NAME=...          } from new-moderator-key.ps1
#   MODERATOR_KEY_HASH=...      }
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: roadpulse
      POSTGRES_USER: roadpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadpulse -d roadpulse"]
      interval: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Database=roadpulse;Username=roadpulse;Password=${POSTGRES_PASSWORD:-change-me-dev-only}"
      Database__MigrateOnStartup: "true"
      Moderation__Moderators__0__Name: ${MODERATOR_NAME:-}
      Moderation__Moderators__0__KeyHash: ${MODERATOR_KEY_HASH:-}
      Tolls__RatesPath: /tolls/toll-rates.csv
      # Share links point here; change to your public address once the server is online.
      Share__PublicBaseUrl: ${SHARE_PUBLIC_BASE_URL:-http://localhost:8080}
      # Live traffic: map matching on the local routing server (ADR 0004).
      Traffic__ValhallaUrl: http://valhalla:8002
    volumes:
      - ./maps:/maps:ro # places files for "import-places" and "import-overture" (setup-places.ps1, setup-overture-places.ps1)
      - ./tolls:/tolls:ro # toll prices you keep up to date (tolls/toll-rates.csv); read on every change
    ports:
      - "8080:8080"

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1
    ports:
      - "8002:8002"
    volumes:
      - ./valhalla_data:/custom_files
    environment:
      tile_urls: https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf
      serve_tiles: "True"
      build_admins: "True"
      build_elevation: "False"
      # Rebuild routing data from a new map file (set to True only by update-map-data.ps1).
      force_rebuild: ${VALHALLA_FORCE_REBUILD:-False}

  # Map tiles served from this computer (optional): run setup-offline-maps.ps1 once, then
  #   docker compose --profile maps up -d tiles
  # Styles: http://localhost:8090/styles/liberty/style.json (day), .../fiord/style.json (night).
  tiles:
    image: maptiler/tileserver-gl-light:v5.7.0
    profiles: ["maps"]
    volumes:
      - ./maps:/data:ro
    ports:
      # This computer only by default (the emulator reaches it as 10.0.2.2:8090). For "Maps from my
      # laptop" on an iPhone, start with TILES_BIND=0.0.0.0 (see docs/IOS.md).
      - "${TILES_BIND:-127.0.0.1}:8090:8080"


  # Public demo (optional, free): one HTTPS address on the internet for the API and routing,
  # through a Cloudflare quick tunnel. Start and stop it with start-public-demo.ps1.
  gateway:
    image: caddy:2
    profiles: ["public"]
    depends_on: [api, valhalla]
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    depends_on: [gateway]
    command: tunnel --no-autoupdate --url http://gateway:80
