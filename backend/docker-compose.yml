# Local backend for RoadPulse development.
#   docker compose up -d
# First start downloads the Malaysia/Singapore/Brunei OpenStreetMap extract and builds
# routing tiles (several minutes, a few GB of disk). Then set in gradle.properties:
#   roadpulse.routingUrl=http://10.0.2.2:8002      (Android emulator -> host machine)
services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    ports:
      - "8002:8002"
    volumes:
      - ./valhalla_data:/custom_files
    environment:
      tile_urls: https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf
      serve_tiles: "True"
      build_admins: "True"
      build_elevation: "False"

  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: roadpulse
      POSTGRES_USER: roadpulse
      POSTGRES_PASSWORD: change-me-dev-only
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
