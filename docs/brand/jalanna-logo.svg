<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A2"/>
      <stop offset="1" stop-color="#0A5A5C"/>
    </linearGradient>
    <clipPath id="tile"><rect width="200" height="200" rx="46"/></clipPath>

    <!-- Pin, J road and destination dot, shared by both versions of the mark. -->
    <g id="pinJ">
      <path d="M100 182 C100 182 44 132 44 86 a56 56 0 0 1 112 0 c0 46 -56 96 -56 96 z" fill="#0A5A5C" fill-opacity="0.35" stroke="#FFFFFF" stroke-width="11" stroke-linejoin="round"/>
      <path d="M124 58 V100 a24 24 0 0 1 -48 0" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
    </g>
    <g id="dot">
      <circle cx="124" cy="56" r="15" fill="#F7931E" stroke="#FFFFFF" stroke-width="5"/>
      <circle cx="124" cy="56" r="6.5" fill="#FFC533"/>
    </g>

    <!-- Full mark: for large sizes (store listing, splash screen). -->
    <g id="mark">
      <rect width="200" height="200" rx="46" fill="url(#bg)"/>
      <g clip-path="url(#tile)" fill="#FFFFFF">
        <path d="M0 150 C40 122 82 122 120 142 L70 200 H0 Z" fill-opacity="0.10"/>
        <path d="M0 176 C30 160 58 160 84 172 L62 200 H0 Z" fill-opacity="0.10"/>
      </g>
      <use href="#pinJ"/>
      <path d="M124 80 V100 a24 24 0 0 1 -48 0" fill="none" stroke="#0A5A5C" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 8"/>
      <use href="#dot"/>
    </g>

    <!-- Simple mark: for phone icon sizes. No dashes, no hills. -->
    <g id="markSmall">
      <rect width="200" height="200" rx="46" fill="url(#bg)"/>
      <use href="#pinJ"/>
      <use href="#dot"/>
    </g>

    <path id="arrow" d="M0 10 L34 0 L20 30 L15 14 Z" fill="#F7931E"/>
  </defs>

  <rect width="960" height="600" fill="#F4F8F8"/>

  <!-- Main lockup -->
  <use href="#mark" transform="translate(70 50) scale(1.1)"/>
  <text x="330" y="182" font-size="104" font-weight="700" fill="#0A3A40" letter-spacing="-3">Jalanna</text>
  <use href="#arrow" transform="translate(596 70) scale(1.25)"/>
  <text x="336" y="232" font-size="28" fill="#5E7578">Our Road, Together</text>

  <!-- App icon sizes -->
  <text x="70" y="350" font-size="17" fill="#5E7578">App icon (simple version for small sizes)</text>
  <use href="#mark" transform="translate(70 370) scale(0.7)"/>
  <use href="#markSmall" transform="translate(235 410) scale(0.4)"/>
  <use href="#markSmall" transform="translate(335 440) scale(0.2)"/>

  <!-- Dark version -->
  <rect x="440" y="360" width="450" height="160" rx="28" fill="#08343A"/>
  <use href="#markSmall" transform="translate(465 385) scale(0.55)"/>
  <text x="600" y="452" font-size="54" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">Jalanna</text>
  <text x="602" y="484" font-size="18" fill="#A6D6D0">Our Road, Together</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
