# Builds the iPhone app on GitHub's Mac machines and saves an unsigned .ipa file.
# To use it: copy this file to .github/workflows/ios-build.yml and push.
# Then on GitHub: Actions > "iOS build" > Run workflow; download "RoadPulse-unsigned-ipa" when it is green.
name: iOS build
on:
  workflow_dispatch:
  push:
    paths: ["iosApp/**", "shared/**", "ci/ios-build.yml", ".github/workflows/ios-build.yml"]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # same as the Android build
      - uses: gradle/actions/setup-gradle@v4
      # The wrapper loses its executable bit when committed from Windows.
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test the shared logic compiles for iPhone
        run: ./gradlew :shared:compileKotlinIosArm64 --stacktrace
      - name: Generate the Xcode project
        run: cd iosApp && xcodegen generate
      - name: Build (unsigned)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild -project iosApp/RoadPulse.xcodeproj -scheme RoadPulse -configuration Release \
            -sdk iphoneos -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build/xcodebuild.log || {
            echo ""
            echo "==================== Swift errors (send these) ===================="
            grep -E "error:" build/xcodebuild.log | sed 's|/Users/runner/work/roadpulse/roadpulse/||' | sort -u | head -40
            exit 1
          }
      - name: Package the .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/RoadPulse.app build/ipa/Payload/
          cd build/ipa && zip -qr RoadPulse-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RoadPulse-unsigned-ipa
          path: build/ipa/RoadPulse-unsigned.ipa
