# Builds RoadPulse and runs the unit tests on every push and pull request.
name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # The wrapper loses its executable bit when committed from Windows.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Check release build is HTTPS-only
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          if "$AAPT2" dump xmltree app/build/outputs/apk/release/app-release-unsigned.apk \
               --file AndroidManifest.xml | grep -i -E "usesCleartextTraffic|networkSecurityConfig"; then
            echo "::error::Release build allows plain HTTP. Cleartext must stay debug-only (src/debug/)."
            exit 1
          fi
          echo "Release manifest has no cleartext settings: HTTPS only."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roadpulse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
