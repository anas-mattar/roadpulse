# Xcode project definition for the iPhone app (XcodeGen: https://github.com/yonaskolb/XcodeGen).
# The .xcodeproj is generated from this file ("xcodegen generate"), so it is not kept in git.
name: RoadPulse
options:
  bundleIdPrefix: com.roadpulse
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"   # the build script below runs Gradle
targets:
  RoadPulse:
    type: application
    platform: iOS
    sources: [RoadPulse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadpulse.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: RoadPulse
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        # The shared Kotlin logic, built by Gradle into a static framework.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework RoadPulseShared"
    preBuildScripts:
      - name: Build shared Kotlin logic
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
