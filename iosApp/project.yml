# Xcode project definition for the iPhone app (XcodeGen: https://github.com/yonaskolb/XcodeGen).
# The .xcodeproj is generated from this file ("xcodegen generate"), so it is not kept in git.
name: RoadPulse
options:
  bundleIdPrefix: com.roadpulse
  deploymentTarget:
    iOS: "16.0"
packages:
  # The map (MapLibre Native for iOS, BSD licence).
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"   # the build script below runs Gradle
targets:
  RoadPulse:
    type: application
    platform: iOS
    sources: [RoadPulse]
    dependencies:
      - package: MapLibre
        product: MapLibre
    # Info.plist is generated from these values.
    info:
      path: RoadPulse/Info.plist
      properties:
        CFBundleDisplayName: Jalanna
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Jalanna shows where you are on the map, plans routes from your position and guides you while you drive.
        # Keep guiding (position and voice) when the screen is off or another app is in front.
        UIBackgroundModes: [location, audio]
        # The laptop's servers are plain HTTP on the home network (Settings > Use my laptop's server).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Search by voice (Apple's speech recognition).
        NSMicrophoneUsageDescription: Jalanna listens when you tap the microphone to search for a place by voice.
        NSSpeechRecognitionUsageDescription: Jalanna turns what you say into a place to search for.
        NSLocalNetworkUsageDescription: Jalanna connects to the Jalanna server on your laptop over your Wi-Fi.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadpulse.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # The shared Kotlin logic, built by Gradle into a static framework.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework RoadPulseShared"
    preBuildScripts:
      - name: Build shared Kotlin logic
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
