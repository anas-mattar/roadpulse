org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# --- RoadPulse service endpoints (override per environment) ---
# Map style (vector tiles built from OpenStreetMap). OpenFreeMap is free and key-less.
roadpulse.mapStyleUrl=https://tiles.openfreemap.org/styles/liberty
# Night style (used after sunset, or always if chosen in settings).
roadpulse.mapStyleDarkUrl=https://tiles.openfreemap.org/styles/fiord
# Valhalla routing server. The FOSSGIS demo server is for development only (fair-use policy);
# switch to your own server from backend/docker-compose.yml (http://10.0.2.2:8002 from the emulator).
roadpulse.routingUrl=https://valhalla1.openstreetmap.de
# Photon geocoder (OpenStreetMap search). Public instance is for development only.
roadpulse.geocodingUrl=https://photon.komoot.io
# RoadPulse reports API (HTTPS). Empty: no server yet, reports stay on the phone.
roadpulse.backendUrl=

# --- Debug builds: your own Docker stack (backend/docker-compose.yml) ---
# 10.0.2.2 is your computer as seen from the Android emulator. Switch in Settings > Server.
roadpulse.local.routingUrl=http://10.0.2.2:8002
roadpulse.local.backendUrl=http://10.0.2.2:8080
# Map tiles from your computer (backend/setup-offline-maps.ps1). Switch in Settings > Server.
roadpulse.local.mapStyleUrl=http://10.0.2.2:8090/styles/liberty/style.json
roadpulse.local.mapStyleDarkUrl=http://10.0.2.2:8090/styles/fiord/style.json
